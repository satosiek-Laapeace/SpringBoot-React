# Bakong KHQR uses Bakong Open API credentials, not ABA PayWay credentials.
# Set the URL explicitly so SIT credentials cannot accidentally be sent to production.
bakong.api.base-url=${BAKONG_API_BASE_URL:}
bakong.api.check-transaction-path=${BAKONG_CHECK_TRANSACTION_PATH:/v1/check_transaction_by_md5}
# Server-only NBC Open API token; never expose this value to the frontend.
bakong.api.token=${BAKONG_API_TOKEN:}
bakong.account-id=${BAKONG_ACCOUNT_ID:}
bakong.merchant-name=${BAKONG_MERCHANT_NAME:}
bakong.merchant-city=${BAKONG_MERCHANT_CITY:}
# Orders are stored in USD. KHR requires an explicit conversion before it can be enabled.
bakong.currency=${BAKONG_CURRENCY:USD}
